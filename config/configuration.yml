save_dir: workspace/weights
model:
  arch:
    name: OneStageDetector
    backbone:
      name: ShuffleNetV2DPU
      model_size: 0.5x
      out_stages: [2,3,4]
      activation: ReLU 
    fpn:
      name: PAN
      in_channels: [48, 96, 192]
      out_channels: 96
      start_level: 0
      num_outs: 3
    head:
      name: NanoDetHead
      num_classes: 1
      input_channel: 96
      feat_channels: 96
      stacked_convs: 2
      share_cls_reg: True
      octave_base_scale: 5
      scales_per_octave: 1
      strides: [8, 16, 32]
      activation: ReLU 
      reg_max: 7
      norm_cfg:
        type: BN
      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: True
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0
data:
  train:
    name: CocoDataset
    img_path: coco2017_dataset/images/train2017
    ann_path: coco2017_dataset/annotations/instances_train2017_PersonOnly.json
    input_size: [320,320] #[w,h]
    keep_ratio: False
    noise: False
    mixup: False
    pipeline:
      perspective: 0.0
      scale: [0.5, 1.5]
      stretch: [[1, 1], [1, 1]]
      rotation: 0
      shear: 0
      translate: 0.2
      flip: 0.5
      brightness: 0.2
      contrast: [0.6, 1.4]
      saturation: [0.5, 1.2]
      # normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
  val:
    name: CocoDataset
    img_path: coco2017_dataset/images/val2017
    ann_path: coco2017_dataset/annotations/instances_val2017_PersonOnly.json
    input_size: [320,320] #[w,h]
    keep_ratio: False
    noise: False
    mixup: False
    pipeline:
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
device:
  gpu_ids: [0]
  workers_per_gpu: 8
  batchsize_per_gpu: 64
schedule:
  # resume:
  # load_model: YOUR_MODEL_PATH
  # transfer_learning: Your pretraiend model path
  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.05
    # param_level_cfg: 
    #   backbone:
    #     lr_mult: 0.1
    #   fpn:
    #     lr_mult: 0.1
    #   head:
    #     lr_mult: 1 # Use this when your are using transfer learning and want to train the head with a higher learning rate
  warmup:
    name: linear
    steps: 500
    ratio: 0.0001
  total_epochs: 300
  lr_schedule:
    name: CosineAnnealingLR
    T_max: 300
    eta_min: 0.00005
  val_intervals: 5

evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP

log:
  interval: 10

class_names: ['person']